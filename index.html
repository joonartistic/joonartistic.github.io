<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  body, body * { letter-spacing: -0.005em; }
  a { color: inherit; }

  :root {
    --bg: #0e0e0c;
    --ink: #f4f1ea;
    --muted: #8a857a;
    --rule: #2a2925;
    --soft: #1a1a17;
    --accent: oklch(72% 0.14 80);
    --serif: 'Newsreader', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body.theme-light {
    --bg: #ecebe6;
    --ink: #1c1c1a;
    --muted: #6f6c63;
    --rule: #c4c1ba;
    --soft: #d8d5cd;
    --accent: #8a4f2a;
  }
  .hero h1 em, .about h2 em { color: var(--accent); }
  body:not(.theme-light) .hero .institution,
  body:not(.theme-light) .hero h1 small,
  body:not(.theme-light).lede-accent .room-head p,
  body:not(.theme-light).lede-accent .pullquote .att,
  body:not(.theme-light).lede-accent .series-head .desc { color: var(--accent); }
  body:not(.theme-light) .pullquote::before { background: var(--accent); }
  body:not(.theme-light) .thumb.on, body:not(.theme-light) .thumb:hover { border-color: var(--accent); }
  body:not(.theme-light) .nav-links button.on { color: var(--accent); border-color: var(--accent); }

  nav.top {
    position: sticky; top: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    padding: 24px 56px; background: var(--bg); align-items: baseline;
    border-bottom: 1px solid transparent; transition: border-color 0.2s;
  }
  nav.top.scrolled { border-color: var(--rule); }
  .mark { font-size: 13px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  .mark span { color: var(--muted); font-weight: 400; }
  .nav-center { text-align: center; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .nav-links { display: flex; gap: 28px; justify-content: flex-end; }
  .nav-links button {
    background: none; border: 0; cursor: pointer; padding: 4px 0; font: inherit;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid transparent;
  }
  .nav-links button.on { color: var(--ink); border-color: var(--ink); }

  .hero { padding: 180px 56px 140px; max-width: 1100px; margin: 0 auto; text-align: center; }
  .hero .institution { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); margin-bottom: 56px; }
  .hero h1 {
    font-family: var(--serif); font-weight: 400; font-style: italic;
    font-size: clamp(54px, 8.4vw, 116px); line-height: 1.02; letter-spacing: -0.025em;
    margin-bottom: 56px;
  }
  .hero h1 small {
    display: block; font-style: normal; font-family: var(--serif);
    font-size: 0.32em; letter-spacing: 0.02em; color: var(--muted); margin-top: 36px; font-weight: 400;
  }
  .hero .dates { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; padding-top: 24px; border-top: 1px solid var(--ink); display: inline-block; min-width: 320px; }

  .room-head { padding: 140px 56px 64px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 220px 1fr; gap: 80px; align-items: end; }
  .room-head .roman { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .room-head .roman b { display: block; font-family: var(--serif); font-size: 80px; letter-spacing: -0.03em; color: var(--ink); margin-top: 12px; font-weight: 400; line-height: 1; }
  .room-head h2 { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: clamp(40px, 5.6vw, 76px); line-height: 1; letter-spacing: -0.02em; }
  .room-head p { margin-top: 28px; max-width: 560px; font-size: 15px; line-height: 1.65; color: var(--muted); }

  .rule { height: 1px; background: var(--ink); max-width: 1400px; margin: 0 auto; }

  .pullquote {
    max-width: 900px; margin: 140px auto 80px; padding: 0 56px;
    font-family: var(--serif); font-style: italic; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.3; letter-spacing: -0.012em; text-align: center;
  }
  .pullquote::before { content: ''; display: block; width: 56px; height: 1px; background: var(--accent); margin: 0 auto 36px; }
  .pullquote .att { display: block; margin-top: 32px; font-family: var(--mono); font-style: normal; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

  .plate { max-width: 1400px; margin: 100px auto; padding: 0 56px; }
  .plate-img-wrap { position: relative; display: inline-block; }
  .plate-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.35); color: #fff; border: none; cursor: pointer;
    font-size: 20px; padding: 10px 14px; opacity: 0; transition: opacity 0.2s;
    line-height: 1;
  }
  .plate-img-wrap:hover .plate-arrow { opacity: 1; }
  .plate-arrow-l { left: 0; }
  .plate-arrow-r { right: 0; }
  .plate-counter {
    position: absolute; bottom: 10px; right: 12px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.4); padding: 3px 7px;
  }
  .plate.feature { margin: 140px auto; }
  /* image + thumbs in a row, thumbs flush to right edge of image */
  .plate-frame { display: flex; justify-content: center; padding: 16px 0; }
  .plate-img { max-width: 600px; max-height: 70vh; object-fit: contain; box-shadow: 0 30px 60px -22px rgba(0,0,0,0.55); display: block; }
  .plate.feature .plate-img { max-width: 760px; max-height: 78vh; }
  .plate.small .plate-img { max-width: 460px; max-height: 56vh; }
  .plate.xsmall .plate-img { max-width: 380px; max-height: 50vh; }

  .thumbs { display: flex; flex-direction: column; gap: 6px; padding-top: 0; align-self: flex-start; }
  .thumb { width: 44px; height: 44px; background: var(--soft); border: 1px solid var(--rule); cursor: pointer; overflow: hidden; transition: border-color 0.15s; padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.on { border-color: var(--ink); }
  .thumb-count { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--muted); text-align: center; margin-bottom: 6px; }

  .label-wrap { margin: 16px auto 0; max-width: 600px; }
  .label-note { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin-bottom: 14px; }
  .label-title { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 22px; line-height: 1.2; margin-bottom: 14px; }
  .label { padding: 16px 0 0; border-top: 1px solid var(--ink); }
  .label .acc { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .label .yr { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .label .med { font-size: 11px; color: var(--muted); line-height: 1.55; font-family: var(--mono); letter-spacing: 0.04em; }

  .series { max-width: 1400px; margin: 140px auto; padding: 0 56px; }
  .series-head { display: grid; grid-template-columns: 220px 1fr; gap: 80px; align-items: end; margin-bottom: 48px; }
  .series-head .acc { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .series-head .acc b { display: block; font-family: var(--serif); font-size: 36px; font-weight: 400; font-style: italic; letter-spacing: -0.01em; color: var(--ink); margin-top: 8px; }
  .series-head .ttl { font-family: var(--serif); font-style: italic; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.05; margin-bottom: 8px; }
  .series-head .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }
  .series-head .desc { margin-top: 16px; max-width: 520px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .series-strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 28px; align-items: end; padding-top: 32px; border-top: 1px solid var(--rule); }
  .series-fig { display: flex; flex-direction: column; gap: 14px; cursor: zoom-in; }
  .series-fig img { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: var(--soft); box-shadow: 0 16px 32px -16px rgba(0,0,0,0.5); }
  .series-fig .cap { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .series-fig .cap b { display: block; font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink); letter-spacing: 0; text-transform: none; margin-top: 4px; font-weight: 400; }

  .draw-grid { max-width: 1400px; margin: 0 auto; padding: 0 56px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 100px 60px; }
  .draw-item { display: flex; flex-direction: column; gap: 18px; cursor: zoom-in; }
  .draw-frame { width: 100%; aspect-ratio: 4/5; background: var(--soft); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5); overflow: hidden; }
  .draw-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .draw-ttl { font-family: var(--serif); font-style: italic; font-size: 17px; margin-bottom: 10px; }
  .draw-cap { padding-top: 14px; border-top: 1px solid var(--rule); }
  .draw-cap .acc { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--muted); margin-bottom: 6px; }
  .draw-cap .ttl { font-family: var(--serif); font-style: italic; font-size: 17px; margin-bottom: 4px; }
  .draw-cap .meta { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }

  .colophon { margin-top: 200px; padding: 80px 56px; border-top: 1px solid var(--ink); max-width: 1400px; margin-left: auto; margin-right: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px; font-family: var(--mono); font-size: 11px; line-height: 1.7; color: var(--muted); }
  .colophon h4 { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); margin-bottom: 12px; font-weight: 500; }
  .colophon a { text-decoration: underline; text-underline-offset: 3px; }

  .about { max-width: 760px; margin: 0 auto; padding: 160px 56px 200px; }
  .about .head { font-family: var(--mono); font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); margin-bottom: 36px; }
  .about h2 { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 60px; }
  .about p { font-size: 19px; line-height: 1.75; margin-bottom: 22px; }
  .about-block { margin-top: 80px; padding-top: 32px; border-top: 1px solid var(--ink); }
  .about-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
  .cv-row { display: grid; grid-template-columns: 100px 1fr; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--soft); font-size: 15px; }
  .cv-row .y { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px; }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 200; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; }
  .lightbox-close { position: absolute; top: 28px; right: 36px; font-family: var(--mono); font-size: 20px; color: #fff; cursor: pointer; opacity: 0.6; }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-meta { position: absolute; bottom: 28px; left: 36px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: rgba(255,255,255,0.7); }

  @media (max-width: 800px) {
    nav.top { grid-template-columns: 1fr auto; padding: 18px 24px; gap: 16px; }
    .nav-center { display: none; }
    .hero { padding: 100px 24px 80px; }
    .hero h1 { font-size: clamp(40px, 12vw, 64px); }
    .room-head, .series-head { grid-template-columns: 1fr; gap: 16px; padding-left: 24px; padding-right: 24px; }
    .room-head .roman b { font-size: 56px; }
    .plate { padding: 0 24px; margin: 64px auto; }
    .plate.feature { margin: 80px auto; }
    .plate-img { max-width: 100% !important; max-height: 60vh; }
    .label { grid-template-columns: 1fr; max-width: 100%; }
    .thumbs { flex-direction: row; }
    .series { padding: 0 24px; margin: 80px auto; }
    .series-strip { grid-template-columns: repeat(2, 1fr); }
    .draw-grid { grid-template-columns: 1fr 1fr; padding: 0 24px; gap: 56px 24px; }
    .colophon { grid-template-columns: 1fr 1fr; padding: 56px 24px; gap: 28px; }
    .about { padding: 100px 24px 120px; }
    .pullquote { padding: 0 24px; margin: 80px auto 56px; }
  }
</style>
</head>

          </div>
        </nav>
        {page === 'works' ? <WorksPage ceramics={ceramics} drawings={drawings} /> : <AboutPage />}
      </>
    );
  }

  function WorksPage({ceramics, drawings}) {
    const sizes = ['feature','feature','normal','feature','xsmall','normal','normal','feature','normal','small','normal','normal','feature','normal'];
    return (
      <>
        <header className="hero">
          <div className="institution">Joon Park · Portfolio</div>
          <h1>At the boundary of<br/><em>clay &amp; ink</em>
            <small>Selected works, 2025 / 2026 · Singapore, Seoul</small>
          </h1>

        </header>
        <div className="room-head">
          <div className="roman">Room <b>I</b></div>
          <div>
            <h2>Ceramics</h2>
            <p>Hand-built pieces in which form arrives slowly through the hand. Eleven works tracing the textures of memory: light through a forest, the discomfort of a dental chair, a swan married to a whale.</p>
          </div>
        </div>
        <div className="rule" />
        {ceramics.map((w, i) => <Plate key={w.title} work={w} size={sizes[i]||'normal'} />)}
        <blockquote className="pullquote">
          “The hand-built form becomes the outline of an experience, and the brushwork follows the way memory surfaces.”
          <span className="att">Statement, 2026</span>
        </blockquote>
        <div className="room-head">
          <div className="roman">Room <b>II</b></div>
          <div>
            <h2>Drawings</h2>
            <p>Pen on paper. A diary of looking: Singapore neighbours, bodies of water, a treetopus. Twelve works in ink.</p>
          </div>
        </div>
        <div className="rule" />
        <div className="draw-grid" style={{paddingTop: 80}}>
          {drawings.map((w, i) => <DrawItem key={w.title} work={w} acc={String(i+12).padStart(2,'0')} />)}
        </div>
        <footer className="colophon">
          <div><h4>Virtual Studio</h4>Singapore / Seoul<br/>By appointment</div>
          <div><h4>Contact</h4><a href="https://instagram.com/joonartistic" target="_blank" rel="noreferrer">@joonartistic</a></div>
          <div><h4>Catalogue</h4>Vol. I · 2025/2026<br/>23 works</div>
          <div><h4>©</h4>Joon Park, 2026<br/>All rights reserved</div>
        </footer>
      </>
    );
  }

  function Plate({work, acc, size}) {
    const [active, setActive] = useState(0);
    const hasMulti = work.frames.length > 1;
    const currentTitle = (work.frames[active] && work.frames[active].label) ? work.frames[active].label : work.title;
    const prev = (e) => { e.stopPropagation(); setActive(a => (a - 1 + work.frames.length) % work.frames.length); };
    const next = (e) => { e.stopPropagation(); setActive(a => (a + 1) % work.frames.length); };
    return (
      <div className={`plate ${size}`}>
        <div className="plate-frame">
          <div className="plate-img-wrap">
            <img className="plate-img" src={work.frames[active].src} alt={work.title}
              onClick={() => openLightbox(work, active)} style={{cursor: 'zoom-in'}} />
            {hasMulti && (
              <>
                <button className="plate-arrow plate-arrow-l" onClick={prev}>&#8592;</button>
                <button className="plate-arrow plate-arrow-r" onClick={next}>&#8594;</button>
                <div className="plate-counter">{active + 1} / {work.frames.length}</div>
              </>
            )}
          </div>
        </div>
        <div className="label-wrap">
          <div className="label-title">{currentTitle}</div>
          {work.note && <div className="label-note">{work.note}</div>}
          <div className="label">
            <div className="yr">{work.year}</div>
            <div className="med">{work.meta}</div>
          </div>
        </div>
      </div>
    );
  }

  function SeriesBlock({work, acc}) {
    const n = work.frames.length;
    return (
      <div className="series">
        <div className="series-head">
          <div className="acc">Acc. JP · {acc} <b>{work.title}</b></div>
          <div>
            <div className="ttl">Five figures · {n} views</div>
            <div className="meta">{work.meta} · {work.year}</div>
            <p className="desc">Sibling figures explored as one work. Each piece holds the same hand, the same hour. Read across, not in sequence.</p>
          </div>
        </div>
        <div className="series-strip" style={{['--n']: Math.min(n, 6)}}>
          {work.frames.map((f, i) => (
            <figure className="series-fig" key={i} onClick={() => openLightbox(work, i)}>
              <img src={f.src} alt={f.label || work.title} />
              <figcaption className="cap">Fig. {String(i+1).padStart(2,'0')}<b>{f.label || work.title}</b></figcaption>
            </figure>
          ))}
        </div>
      </div>
    );
  }

  function DrawItem({work, acc}) {
    return (
      <div className="draw-item" onClick={() => openLightbox(work, 0)}>
        <div className="draw-frame"><img src={work.frames[0].src} alt={work.title} /></div>
        <div className="draw-ttl">{work.title}</div>
        <div className="draw-cap">
          <div className="meta">{work.meta} · {work.year}</div>
        </div>
      </div>
    );
  }

  function AboutPage() {
    return (
      <div className="about">
        <div className="head">Statement</div>
        <h2>at the <em>boundary</em> of clay &amp; ink.</h2>
        <p>My work begins with personal experience. The quality of light in a forest, a landscape encountered while traveling, the discomfort of a dental procedure, the textures of everyday life find their way onto clay.</p>
        <p>The hand-built form becomes the outline of an experience, and the brushwork follows the way memory surfaces. I work at the boundary of ceramics and painting, exploring the moment when vivid experience becomes material.</p>
        <div className="about-block">
          <div className="about-label">Curriculum Vitae</div>
          <div className="cv-row"><span className="y">2025–</span><span>Ceramics &amp; Drawing practice, Singapore / Seoul</span></div>
          <div className="cv-row"><span className="y">2016</span><span>MSc Organizational Psychology, Erasmus University, Netherlands</span></div>
          <div className="cv-row"><span className="y">2014</span><span>BA Psychology, Catholic University of Korea</span></div>
        </div>
        <div className="about-block">
          <div className="about-label">Contact</div>
          <p style={{fontSize:17}}><a href="https://instagram.com/joonartistic" target="_blank" rel="noreferrer" style={{textDecoration:'underline', textDecorationColor:'var(--accent)', textUnderlineOffset:4}}>@joonartistic</a></p>
        </div>
      </div>
    );
  }

  window.openLightbox = function(work, idx) {
    const lb = document.getElementById('lightbox');
    document.getElementById('lightboxImg').src = work.frames[idx].src;
    document.getElementById('lightboxMeta').textContent = `${work.title} · ${work.meta} · ${work.year}`;
    lb.classList.add('open');
  };
  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
  });

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
