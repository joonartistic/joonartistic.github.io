<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  body, body * { letter-spacing: -0.005em; }
  a { color: inherit; }

  :root {
    --bg: #0e0e0c;
    --ink: #f4f1ea;
    --muted: #8a857a;
    --rule: #2a2925;
    --soft: #1a1a17;
    --accent: oklch(72% 0.14 80);
    --serif: 'Newsreader', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body.theme-light {
    --bg: #ecebe6;
    --ink: #1c1c1a;
    --muted: #6f6c63;
    --rule: #c4c1ba;
    --soft: #d8d5cd;
    --accent: #8a4f2a;
  }
  .hero h1 em, .about h2 em { color: var(--accent); }
  body:not(.theme-light) .hero .institution,
  body:not(.theme-light) .hero h1 small,
  body:not(.theme-light).lede-accent .room-head p,
  body:not(.theme-light).lede-accent .pullquote .att,
  body:not(.theme-light).lede-accent .series-head .desc { color: var(--accent); }
  body:not(.theme-light) .pullquote::before { background: var(--accent); }
  body:not(.theme-light) .thumb.on, body:not(.theme-light) .thumb:hover { border-color: var(--accent); }
  body:not(.theme-light) .nav-links button.on { color: var(--accent); border-color: var(--accent); }

  nav.top {
    position: sticky; top: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    padding: 24px 56px; background: var(--bg); align-items: baseline;
    border-bottom: 1px solid transparent; transition: border-color 0.2s;
  }
  nav.top.scrolled { border-color: var(--rule); }
  .mark { font-size: 13px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  .mark span { color: var(--muted); font-weight: 400; }
  .nav-center { text-align: center; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .nav-links { display: flex; gap: 28px; justify-content: flex-end; }
  .nav-links button {
    background: none; border: 0; cursor: pointer; padding: 4px 0; font: inherit;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid transparent;
  }
  .nav-links button.on { color: var(--ink); border-color: var(--ink); }

  .hero { padding: 180px 56px 140px; max-width: 1100px; margin: 0 auto; text-align: center; }
  .hero .institution { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); margin-bottom: 56px; }
  .hero h1 {
    font-family: var(--serif); font-weight: 400; font-style: italic;
    font-size: clamp(54px, 8.4vw, 116px); line-height: 1.02; letter-spacing: -0.025em;
    margin-bottom: 56px;
  }
  .hero h1 small {
    display: block; font-style: normal; font-family: var(--serif);
    font-size: 0.32em; letter-spacing: 0.02em; color: var(--muted); margin-top: 36px; font-weight: 400;
  }
  .hero .dates { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; padding-top: 24px; border-top: 1px solid var(--ink); display: inline-block; min-width: 320px; }

  .room-head { padding: 140px 56px 64px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 220px 1fr; gap: 80px; align-items: end; }
  .room-head .roman { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .room-head .roman b { display: block; font-family: var(--serif); font-size: 80px; letter-spacing: -0.03em; color: var(--ink); margin-top: 12px; font-weight: 400; line-height: 1; }
  .room-head h2 { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: clamp(40px, 5.6vw, 76px); line-height: 1; letter-spacing: -0.02em; }
  .room-head p { margin-top: 28px; max-width: 560px; font-size: 15px; line-height: 1.65; color: var(--muted); }

  .rule { height: 1px; background: var(--ink); max-width: 1400px; margin: 0 auto; }

  .pullquote {
    max-width: 900px; margin: 140px auto 80px; padding: 0 56px;
    font-family: var(--serif); font-style: italic; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.3; letter-spacing: -0.012em; text-align: center;
  }
  .pullquote::before { content: ''; display: block; width: 56px; height: 1px; background: var(--accent); margin: 0 auto 36px; }
  .pullquote .att { display: block; margin-top: 32px; font-family: var(--mono); font-style: normal; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

  .plate { max-width: 1400px; margin: 100px auto; padding: 0 56px; }
  .plate-img-wrap { position: relative; display: inline-block; }
  .plate-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.35); color: #fff; border: none; cursor: pointer;
    font-size: 20px; padding: 10px 14px; opacity: 0; transition: opacity 0.2s;
    line-height: 1;
  }
  .plate-img-wrap:hover .plate-arrow { opacity: 1; }
  .draw-frame .plate-arrow { opacity: 0.55; padding: 6px 10px; font-size: 15px; }
  .draw-frame:hover .plate-arrow { opacity: 1; }
  .plate-arrow-l { left: 0; }
  .plate-arrow-r { right: 0; }
  .plate-counter {
    position: absolute; bottom: 10px; right: 12px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.4); padding: 3px 7px;
  }
  .plate.feature { margin: 140px auto; }
  /* image + thumbs in a row, thumbs flush to right edge of image */
  .plate-frame { display: flex; justify-content: center; padding: 16px 0; }
  .plate-img { max-width: 600px; max-height: 70vh; object-fit: contain; box-shadow: 0 30px 60px -22px rgba(0,0,0,0.55); display: block; }
  .plate.feature .plate-img { max-width: 760px; max-height: 78vh; }
  .plate.small .plate-img { max-width: 460px; max-height: 56vh; }
  .plate.xsmall .plate-img { max-width: 380px; max-height: 50vh; }

  .thumbs { display: flex; flex-direction: column; gap: 6px; padding-top: 0; align-self: flex-start; }
  .thumb { width: 44px; height: 44px; background: var(--soft); border: 1px solid var(--rule); cursor: pointer; overflow: hidden; transition: border-color 0.15s; padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.on { border-color: var(--ink); }
  .thumb-count { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--muted); text-align: center; margin-bottom: 6px; }

  .label-wrap { margin: 16px auto 0; max-width: 600px; }
  .label-note { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin-bottom: 14px; }
  .label-title { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 22px; line-height: 1.2; margin-bottom: 14px; }
  .label { padding: 16px 0 0; border-top: 1px solid var(--ink); }
  .label .acc { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .label .yr { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .label .med { font-size: 11px; color: var(--muted); line-height: 1.55; font-family: var(--mono); letter-spacing: 0.04em; }

  .series { max-width: 1400px; margin: 140px auto; padding: 0 56px; }
  .series-head { display: grid; grid-template-columns: 220px 1fr; gap: 80px; align-items: end; margin-bottom: 48px; }
  .series-head .acc { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .series-head .acc b { display: block; font-family: var(--serif); font-size: 36px; font-weight: 400; font-style: italic; letter-spacing: -0.01em; color: var(--ink); margin-top: 8px; }
  .series-head .ttl { font-family: var(--serif); font-style: italic; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.05; margin-bottom: 8px; }
  .series-head .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }
  .series-head .desc { margin-top: 16px; max-width: 520px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .series-strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 28px; align-items: end; padding-top: 32px; border-top: 1px solid var(--rule); }
  .series-fig { display: flex; flex-direction: column; gap: 14px; cursor: zoom-in; }
  .series-fig img { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: var(--soft); box-shadow: 0 16px 32px -16px rgba(0,0,0,0.5); }
  .series-fig .cap { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .series-fig .cap b { display: block; font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink); letter-spacing: 0; text-transform: none; margin-top: 4px; font-weight: 400; }

  .draw-grid { max-width: 1400px; margin: 0 auto; padding: 0 56px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 100px 60px; }
  .draw-item { display: flex; flex-direction: column; gap: 18px; cursor: zoom-in; }
  .draw-frame { position: relative; width: 100%; aspect-ratio: 4/5; background: var(--soft); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5); overflow: hidden; }
  .draw-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .draw-ttl { font-family: var(--serif); font-style: italic; font-size: 17px; margin-bottom: 10px; }
  .draw-cap { padding-top: 14px; border-top: 1px solid var(--rule); }
  .draw-cap .acc { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--muted); margin-bottom: 6px; }
  .draw-cap .ttl { font-family: var(--serif); font-style: italic; font-size: 17px; margin-bottom: 4px; }
  .draw-cap .meta { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }

  .label-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .label-facts { flex: 1; min-width: 0; }
  .note-toggle {
    flex-shrink: 0; background: none; border: none; color: var(--muted);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0; cursor: pointer; transition: color 0.2s; white-space: nowrap; line-height: 1.6;
  }
  .note-toggle:hover { color: var(--ink); }
  .note-text { font-size: 14px; line-height: 1.75; color: var(--ink); max-width: 560px; margin-top: 18px; white-space: pre-line; }
  .note-text.empty { color: var(--muted); font-style: italic; }
  .colophon { margin-top: 200px; padding: 80px 56px; border-top: 1px solid var(--ink); max-width: 1400px; margin-left: auto; margin-right: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px; font-family: var(--mono); font-size: 11px; line-height: 1.7; color: var(--muted); }
  .colophon h4 { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); margin-bottom: 12px; font-weight: 500; }
  .colophon a { text-decoration: underline; text-underline-offset: 3px; }

  .about { max-width: 760px; margin: 0 auto; padding: 160px 56px 200px; }
  .about .head { font-family: var(--mono); font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); margin-bottom: 36px; }
  .about h2 { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 60px; }
  .about p { font-size: 19px; line-height: 1.75; margin-bottom: 22px; }
  .about-block { margin-top: 80px; padding-top: 32px; border-top: 1px solid var(--ink); }
  .about-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
  .cv-row { display: grid; grid-template-columns: 100px 1fr; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--soft); font-size: 15px; }
  .cv-row .y { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px; }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 200; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; }
  .lightbox-close { position: absolute; top: 28px; right: 36px; font-family: var(--mono); font-size: 20px; color: #fff; cursor: pointer; opacity: 0.6; }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.08); color: #fff; border: none; cursor: pointer;
    font-size: 26px; padding: 16px 18px; opacity: 0.6; transition: opacity 0.2s;
    line-height: 1; z-index: 5;
  }
  .lightbox-arrow:hover { opacity: 1; }
  .lightbox-arrow-l { left: 18px; }
  .lightbox-arrow-r { right: 18px; }
  .lightbox-meta { position: absolute; bottom: 28px; left: 36px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: rgba(255,255,255,0.7); }

  @media (max-width: 800px) {
    nav.top { grid-template-columns: 1fr auto; padding: 18px 24px; gap: 16px; }
    .nav-center { display: none; }
    .hero { padding: 100px 24px 80px; }
    .hero h1 { font-size: clamp(40px, 12vw, 64px); }
    .room-head, .series-head { grid-template-columns: 1fr; gap: 16px; padding-left: 24px; padding-right: 24px; }
    .room-head .roman b { font-size: 56px; }
    .plate { padding: 0 24px; margin: 64px auto; }
    .plate.feature { margin: 80px auto; }
    .plate-img { max-width: 100% !important; max-height: 60vh; }
    .label { grid-template-columns: 1fr; max-width: 100%; }
    .thumbs { flex-direction: row; }
    .series { padding: 0 24px; margin: 80px auto; }
    .series-strip { grid-template-columns: repeat(2, 1fr); }
    .draw-grid { grid-template-columns: 1fr 1fr; padding: 0 24px; gap: 56px 24px; }
    .colophon { grid-template-columns: 1fr 1fr; padding: 56px 24px; gap: 28px; }
    .about { padding: 100px 24px 120px; }
    .pullquote { padding: 0 24px; margin: 80px auto 56px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="lightbox" id="lightbox">
  <span class="lightbox-close">✕</span>
  <button class="lightbox-arrow lightbox-arrow-l" id="lightboxPrev">&#8592;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-arrow lightbox-arrow-r" id="lightboxNext">&#8594;</button>
  <div class="lightbox-meta" id="lightboxMeta"></div>
</div>

  const ARTIST_NOTES = [
    { title: "Serpentina di Córdoba", note: "Inspired by the warm tones and fluid curves of Córdoba, a city where distinct cultural layers overlay. The sweeping lines capture the harmonious flow of light, color, and architecture found within its historic space." },
    { title: "Spring", note: "Capturing the subtle yet dynamic awakening of nature. The interplay of soft hues and emerging forms evokes a sense of renewal, vitality, and light." },
    { title: "Manhattan", note: "Manhattan compresses the island into a single upright form. Slab-built and left standing tall and narrow, the piece follows the vertical pressure of a city that can only grow upward, where space is so limited that everything is pushed toward the sky.\n\nThick, dark lines run across the surface, laying out the grid of streets and the sharp angles of the buildings that sit within it. Against these straight edges the clay itself curves and leans, and that meeting of the curve and the right angle carries the particular appeal of the city: covered in concrete, shadowed and hard-edged, yet sleek and confident in a way that is difficult to imitate." },
    { title: "After she left my bed", note: "An imagined scene from Norway, where the aurora enters through a window and settles across the bedsheets. In French the aurora takes a feminine form, and the piece follows that thought, treating the light as a presence that arrives in the night and lies beside you.\n\nThe undulating slab holds the drape of a blanket, while the deep indigo and grey glazes trace the way the light moves and pools. When the sun rises she is gone, and the title marks the quiet that remains after her leaving." },
    { title: "Pearl House", note: "A pearl oyster rendered in clay, exploring how color forms beneath the surface of water. Submerged light filters down and meets the minerals held in the sea, and from that slow encounter the shell draws out its iridescence.\n\nThe teal glaze pools and shifts across the ridged interior, tracing the way light behaves underwater, while a single pearl rests at the rim as the quiet result of that long process." },
    { title: "Garden, After Dark", note: "Inspired by a memory of a narrow garden somewhere in New York, this piece reinterprets a confined urban space as a place of unexpected quiet. Surrounded on all sides by buildings, the garden opened a pocket of stillness in the middle of the density, and the city seemed to soften the moment you stepped inside.\n\nThe work draws on the Korean concept of yeobaek, the idea that what is left empty carries as much weight as what is filled. Here the emptiness is conceptual rather than formal. The form appears contained within a minimal, box-like structure, yet holds a void within it, offering a site of rest and expanse in the middle of a crowded city." },
    { title: "3 Folks", note: "An exploration of human connection and shared space among three distinct presences. Overlapping forms and nuanced tones reflect the quiet dialogue, warmth, and subtle dynamics of collective intimacy." },
    { title: "Conflict", note: "A visual investigation of tension, raw friction, and dynamic equilibrium. Sharp contrasts and colliding textures capture the emotional intensity and energy born from opposing forces." },
    { title: "Swan married Whale", note: "This sculptural piece is born from a fascination with two of nature's most graceful curved surfaces: the elegant silhouette and sweeping tail feathers of a swan gliding upon a tranquil lake, and the powerful flukes of a whale breaking the deep ocean surface.\n\nCrafted by gently bending a thin ceramic slab into an organic, fluid form, it seeks to visualize the delicate harmony between calmness and the dynamic energy of movement through water. The expansive, graceful curves explore the elegant contrast between these two majestic tail forms.\n\nThe indigo and grey-blue glazes, bleeding across the surface like ink on paper, trace the ceaseless flow of water. The bold, dark drips along the edge capture the precise moment the surface is cut. I aimed to express tranquility in motion, a power that is inherently gentle." },
    { title: "Reflection on the Lake", note: "Inspired by the serene memory of leaves mirrored upon the crystal-clear surface of Lake Bled in Slovenia. The gentle undulations of the ceramic plane evoke the subtle ripples moving across tranquil waters, while the fluid, ink-like strokes capture the fleeting reflection of nature resting upon a liquid canvas." },
    { title: "After Dentist Office Visit", note: "A visceral, sculptural translation of the overwhelming and raw sensory trauma experienced during dental treatment. The vessel's intentionally unrefined, jagged, and uneven rim mirrors the extreme physical tension and heightened sensitivity of the body during the procedure. The heavy, uncontrolled, and bleeding black glaze drips that cascade down the form symbolize the pulsating, uncontained, and excruciating sensation of pain that cannot be suppressed. Through this form, I sought to freeze the primal feeling of vulnerability and helplessness born from acute physical trauma." },
    { title: "Don't Forget to Make My Head", note: "Born from the humorous reality of running out of studio time while sculpting the human form. With no time left to craft the head, the process was abruptly halted, turning a moment of constraint into a brilliant 'happy accident.' The headless, anonymous form paired with a nonchalant, relaxed posture transforms a race against the clock into a witty commentary on completeness and spontaneous resolution." },
    { title: "Forest Light", note: "Inspired by the serene depth of a forest at sunset, this piece captures the interplay of light filtering through the trees. The deep indigo and navy background represents the gathering shadows and twilight stillness of the woods. Strikes of raw yellow slip-trailing symbolize the final, golden sunbeams piercing through the dark tree trunks. The undulating ceramic form evokes the forest topography and guides the flow of light across the visual terrain." },
    { title: "Flow", note: "An exploration of what it feels like to gaze at the sea on a pitch-black night, completely devoid of light. The deep, dark tone and softly undulating contours embody the silent, continuous swell of ocean waters moving through total darkness. Delicate lines carved into the ceramic surface trace the subtle, unseen currents, capturing the immense yet peaceful breath of a nocturnal tide." },
    { title: "The Plate for Well-fermented Cheese", note: "Created with a specific sense of humor and a deep appreciation for pungent, aged cheeses, this piece is titled The Plate for Well-fermented Cheese.\n\nSculpted in the playful form of a well-worn sandal, it serves as a self-deprecating nod to the characteristically musty aroma shared by aged cheeses and used footwear. Serving my favorite, strongly aromatic cheeses from this unique 'shoe' plate adds a layer of wit to the dining experience, celebrating the complex flavors while cheekily acknowledging their common olfactory comparison.\n\nThe hand-sculpted texture and blue strap reinforce the piece's artisanal and lighthearted character." },
    { title: "Randonnée", note: "In French, 'randonnée' refers to a journey or circuit walk that ultimately leads back to where it began. Having lived in five countries and traveled extensively, I crafted this piece as my most humble and unpretentious vessel.\n\nStripped of all excess, its minimal form reflects the natural cycle of clay, molded and fired into a plate, yet destined to eventually break and return to the earth. It is an exploration of impermanence, simplicity, and the beautiful inevitability of returning to one's origins." },
    { title: "Wiggle Wiggle", note: "Inspired by the vibrant tropical wildlife of Singapore, particularly the striking colors and fluid movements of tropical caterpillars. These cutlery rests capture the playful, organic wiggle of a caterpillar through looping ceramic ribbons designed to hold utensils. Bright, layered glaze patterns and dynamic twists turn a small, vivid encounter with nature into a functional and whimsical element for the dining table." },
    { title: "Minotaur, In Need of Retirement", note: "An empathetic and subtly humorous reinterpretation of the mythical Minotaur, reframing a fearsome monster into a weary, overworked victim of fate. Born through divine punishment and human greed, he was locked away in a dark labyrinth and forced into a continuous cycle of bloody sacrifices.\n\nDraped in a simple apron to shield himself from the constant blood splatter, his slumped posture and exhausted facial expression convey profound burnt-out melancholy. Beyond the heroic legends lies a tragic figure who never chose his gruesome destiny, capturing a poignant creature who is, above all else, desperately in need of retirement." },
    { title: "Huh?", note: "Inspired by a memorable everyday scene witnessed while living in Japan, a person deeply immersed in their own isolated world behind wireless earbuds, suddenly startled into a confused 'Huh?' when unexpectedly addressed.\n\nThe slightly tilted chin and dazed, frozen facial expression capture that disorienting split second when music fades and reality abruptly breaks through. It is a witty, sculptured slice of modern life, observing the delicate boundary between urban solitude and spontaneous human interaction." },
    { title: "Frankenstein", note: "A poignant sculpture exploring the existential grief and isolation of Frankenstein's creation, reinterpreted through the lens of a being utterly abandoned by its creator.\n\nReframing the creature away from traditional horror tropes, this piece captures the quiet agony of being rejected by the very hands that brought him to life. The raw, cracked texture of the clay mirrors both physical scars and a fractured soul. With heavy, sorrowful eyes and a silent, melancholic expression, the work freezes the tragic reality of absolute abandonment, revealing a vulnerable entity longing for warmth and acceptance." },
    { title: "A Stained Person on the Couch", note: "A work from the 'Stained' series, inspired by the delicate, segmented beauty of the stained glass at Sainte-Chapelle in Paris. It captures a routine, comfortable posture I frequently assume, resting peacefully in a moment of self-immersion.\n\nThe bold outlines anchor the piece like heavy window frames or sturdy tree trunks, while the intricate internal dots and patterns reflect the radiant mosaic of stained glass. Loose strokes extending past the contours branch out like climbing vines, organically intertwining the figure with the couch. These vine-like tendrils evoke a sense of taking deep root in everyday relaxation, animating the quiet space with organic vitality." },
    { title: "Stained Entry", note: "A piece from the 'Stained' series capturing the suspended, graceful moment of a figure diving into water.\n\nThis artwork highlights the subtle beauty of 'Yeobaek' (여백, empty / negative space). By intentionally leaving the water unpainted, the vast canvas invites the viewer's imagination to fill the void. The fluid, sweeping brushlines trace the dynamic arc of the dive, conveying speed and liberation just before entry. The striking contrast between the figure's mosaic-like interior and the surrounding emptiness turns a fleeting gesture into a pure, timeless motion." },
    { title: "Stained Anatomy", note: "An abstract reimagining of the full figure, built from a long horizontal band that moves across the page like a wave. The contours rise and fall in a steady swell, and a face, a torso, limbs, and feet surface within that rhythm rather than sitting in correct proportion. Filled with jewel-toned cells and fine stippling, the body reads less like a diagram and more like water holding light." },
    { title: "Stained Workout", note: "Translating the quiet intensity of a home workout into the language of stained glass, Stained Workout explores the sacred quality found within daily personal routines.\n\nA striking diagonal posture, anchored firmly to the ground while reaching dynamically upward, creates a powerful architectural balance. Bold lead-like contours isolate the tension, breath, and core strength generated throughout the body, filling each segment with vibrant stippled color. Here, the physical exertion of everyday training is reimagined as a meditative ritual, where sweat and focus transform into a glowing mosaic of inner strength." },
    { title: "Stained Work", note: "An abstract portrayal of the daily work routine, Stained Work translates the static activity of sitting at a desk into a fluid, almost dynamic journey.\n\nUsing the series' signature bold, lead-like contours and intricate stippled mosaic cells, the artwork isolates each element of the anatomy, the furniture, and the technology. The central focus is the symbiotic fusion of the chair and table into a single, cohesive form. Their support structures are singular and sinuous; the chair's base flows in an S-curve, while the table's pillar dissolves into a wave-like form on the ground.\n\nThis integration transforms the desk and chair into an unusual vehicle or craft. The figure, nestled within, appears less like a worker and more like a pilot navigating a thought-realm. The everyday, stationary act of work is reimagined as a moving experience, emphasizing the fluid, non-static nature of thought and digital focus. Work has its own movement, its own inner velocity." },
    { title: "Stained Scoliosis", note: "The foundational origin piece of the Stained series, Stained Scoliosis stems from a deeply personal revelation: finding aesthetic beauty within the curved silhouette of scoliosis seen on childhood X-rays.\n\nInstead of viewing the deviation as a medical flaw, the artwork embraces the curvature as a fluid, organic rhythm. Bold, lead-like contours trace the spinal path across the canvas, bridging the gap between medical imaging and stained-glass architecture. Each cell is filled with vibrant, jewel-toned color, transforming a physical trait into a glowing tapestry of light. This piece marks the birth of the series, celebrating self-acceptance and the unexpected elegance found within our unique forms." },
    { title: "Stained Person on the Throne", note: "Stained Person on the Throne looks at a very familiar everyday moment: scrolling through a smartphone while sitting on the toilet.\n\nBold contours outline the forward-curved posture, while fine stippling and color cells fill the figure. It offers an honest, lighthearted look at a quiet personal routine, capturing the rhythm of modern life through clean lines and color." },
    { title: "Stained Pickleball (Where is the ball?)", note: "Stained Pickleball captures the energy and focus of playing pickleball.\n\nAn over-the-shoulder perspective places the viewer right on the court behind the player. Blue court lines, a wavy net structure, and colorful stippling across the figure come together to show the movement, pace, and simple fun of the game." },
    { title: "Stained Sunday Afternoon", note: "Stained Sunday Afternoon captures a peaceful Sunday moment of relaxing on the couch.\n\nThe sofa and the standing floor lamp bring a warm, cozy feel to the scene. Bold contours trace the long, resting figure, while stippling and color fill the form to share a quiet, relatable sense of weekend comfort." },
    { title: "Stained Pipe Smoker", note: "Stained Pipe Smoker places a gat and a long smoking pipe on an otherwise contemporary figure. The gat is the wide-brimmed horsehair hat worn by men of the Joseon dynasty, semi-transparent and finely woven, and here it sits above clothing that could belong to almost any period.\n\nNothing else is fixed. The gender is left ambiguous, and there is no clear signal of where this person comes from. Rather than presenting a single cultural identity, the drawing lets a historical Korean object and an unplaceable modern body share one outline without either taking over.\n\nThe stippled cells carry the stained glass logic of the series, breaking the figure into small units of color so that it appears lit from within. Around it, the page is left open. This is yeobaek, the Korean principle that unmarked space holds as much weight as what is drawn. The emptiness is not a missing background. It is what gives the figure air and keeps the density of the pattern readable." },
    { title: "Crossing the Line to Supermarket", note: "Crossing the Line to Supermarket captures a scene observed on an everyday walk to the grocery store.\n\nViewed from an elevated top-down perspective, a silhouette walks along a winding path framed by a road, trees, and water. Bold black contours divide each landscape section while detailed stippling fills the space, turning a simple routine errand into a clean, rhythmic view of a daily route." },
    { title: "2126", note: "2126 imagines a future where rising sea levels submerge some of the land back into the ocean, recalling an ancient era when parts of today's continents were deep underwater.\n\nSquid, fish, and eels swim freely around some mountain peaks now covered by the sea. Rhythmic wave lines near the top and detailed stippling throughout capture a quiet underwater world, reflecting on the long cycle of land and ocean through bold lines and colorful dots." },
    { title: "Stained Point Taken", note: "Stained Point Taken captures a tense confrontation reminiscent of a scene from a gritty crime movie.\n\nThe bold composition places two figures face-to-face as one points a gun directly at the other. Jagged, thorn-like outlines give the figures a rough and dangerous edge, while fine stippling and selective pops of color bring sharp focus to this cinematic moment." },
    { title: "Trembling", note: "Trembling is a black ink drawing inspired by the twisted forms of bush vines, reinterpreted with an elongated trunk and expressive brushwork.\n\nReimagining the traditional low-growing vine into a taller structure, the drawing features drill-like branches extending upward with quivering black lines. Executed entirely in monochromatic ink, it captures the raw motion and unrefined energy of nature through simple line variations." },
    { title: "Stained Prometheus", note: "Stained Prometheus offers a humanized perspective on the classic myth, bringing focus to the sheer exhaustion and thirst within an endless ordeal.\n\nBound in chains, the figure strains forward toward a single drop falling from above, capturing the physical fatigue and longing of a god whose body heals only to suffer again. Bold outlines, fine stippling, and structured color blocks portray both the weight of his continuous trial and the quiet endurance driven by his sacrifice for humanity." },
    { title: "Dancing Singapore", note: "Dancing Singapore blends the fluid forms of tropical trees observed in Singapore with the rhythmic movement of giant centipedes.\n\nTrunks and branches sway upward in dancing motions, accented by bright orange loops, dots, and leg-like patterns running along their sides. Detailed pen hatching in brown and black ink contrasts with lively orange accents, capturing the organic, dynamic energy of tropical nature." },
    { title: "Uncontained", note: "Uncontained captures the lively energy of a plant expanding far beyond the limits of a small pot.\n\nSketched at the base, the small container gives way to curving green leaves, dotted lines, and fluid strokes that burst outward. Using light colored pencil and pen linework, the drawing presents an organic form growing freely past its boundary." },
    { title: "Who Owns Gardens of the Bay?", note: "While everyone marvels at the massive, futuristic Supertrees, the real master of Singapore's urban jungle might just be this tiny gecko right in the center. Inspired by the countless geckos that silently share the city with us, this piece offers a lighthearted and witty perspective on who truly owns the garden." },
    { title: "Treetopus", note: "Inspired by the striking resemblance between the winding roots of tropical trees and the fluid movement of octopus tentacles, Treetopus brings a whimsical hybrid to life. Featuring rich, textured line work complemented by vibrant blue suction-cup accents and red highlights, this piece playfully blurs the boundary between botanical forms and marine life." },
    { title: "My Neighbor in Singapore", note: "Inspired by a tiny gecko that briefly moved onto the shoe rack outside my home in Singapore. Fascinated by how geckos change their colors to blend into their surroundings like chameleons, I reimagined this little visitor camouflage-bound within vibrant flowers. Featuring cheerful, petal-like toes and lively blue-and-orange patterns, this piece warmly captures a sweet, unforgettable encounter with an urban neighbor." },
    { title: "Dental Care with a Bird", note: "Created while anxiously awaiting a dental appointment prior to a diagnosis, this piece gracefully transforms apprehension into playful optimism. Inspired by the famous symbiotic bond between crocodiles and Egyptian plovers, it features a child jumping along tooth-shaped stepping stones alongside a friendly bird. Through this whimsical interaction, the daunting prospect of dental care is reframed as a heartwarming moment of shared care and play." },
    { title: "Conceptual Ceramic Vase", note: "Inspired by the iconic geometric tessellation of Issey Miyake's signature Bao Bao design, this illustration reimagines fashion's structural artistry as a conceptual ceramic vase. The sharply articulated, architectural facets of the vessel create a striking visual counterpoint to the soft, organic forms of the vibrant flowers blooming within." },
    { title: "Happiness", note: "This artwork captures a warm and joyful moment between two middle-aged women sharing a conversation near Gyeonghuigung. Seated together on a rounded stone bench beneath the gentle presence of an old tree, their sincere interaction conveys the genuine warmth and simple, pure happiness found in everyday life." },
    { title: "Vein", note: "This artwork reflects the philosophical idea that all elements of nature, earth, water, air, trees, and flowers, are interconnected. Emulating the function of veins that transport life throughout a body, colorful line work flows from the roots through the trunk to the blossoming flowers, illustrating the organic bond and continuous cycle of life." },
    { title: "Path", note: "This artwork reinterprets the winding grain of a tree trunk as a 'path' representing life's journey toward a hopeful future. Following the curved, textured trunk leads the viewer's eye up to a crown of vibrant green leaves, symbolizing a positive destination and bright hope reached through life's turns and curves." },
    { title: "Wuthering Heights", note: "Inspired by a scene from the film Wuthering Heights, this artwork stylishly depicts the side profile of a figure dressed in classic 19th-century attire, complete with an elegant gown, hat, and parasol. The detailed diagonal hatching of the purple dress creates a striking contrast with the orange accent pattern inside the parasol, capturing a timeless period aesthetic along with a quiet, captivating presence." },
    { title: "Traffic Accidents", note: "This artwork captures a playful and imaginative perspective inspired by the crowded koi ponds often found in Japanese gardens. Depicting colorful koi fish swimming and crossing paths in various directions, the composition humorously analogies their movement to a near-collision 'traffic accident' on a busy road. The vibrant hues and dynamic line work bring a cheerful, lively rhythm to the piece." },
    { title: "Millions of Ways", note: "This artwork represents the countless paths and infinite possibilities of life through an intertwining of geometric staircases and lines. Various paths, some straight, some winding, and others looping back, are rendered in a vibrant array of colors, including blue, green, orange, yellow, and purple. Though seemingly complex, each line, with its unique color and direction, symbolizes the distinct and beautiful journey of life that each individual creates." },
    { title: "Fishermen", note: "This artwork creatively captures fishermen resting or sharing everyday moments in a quiet Mediterranean village using unique geometric lines and planes. The light blue stripe patterns evoke the refreshing spirit of the Mediterranean Sea, while warm beige tones and fluid brown outlines harmonize to convey a peaceful and relaxed snapshot of a fisherman's life." },
    { title: "Pose", note: "Inspired by the striking and confident silhouette of a tree spotted at a botanical garden, this artwork captures nature posing like a model on a fashion week runway. Dynamic diagonal branches, a subtle yellow aura, and textured green foliage combine to highlight the stylish, elegant, and fashionable energy inherent in the natural world." },
    { title: "Bull Trap", note: "This artwork explores the dual concept of a 'Bull Trap', capturing both the physical moment a charging bull suddenly shifts direction and the financial term describing a false market rebound that leads to a decline. The dynamic angle of the bull, the dense hatching of brown pen lines, and the sharp white vertical gap across its torso visually emphasize a sudden pivot and unexpected shift in momentum." },
  ];

  function App() {
    const [page, setPage] = useState('works');
    const [scrolled, setScrolled] = useState(false);
    useEffect(() => {
      const onScroll = () => setScrolled(window.scrollY > 8);
      window.addEventListener('scroll', onScroll, { passive: true });
      return () => window.removeEventListener('scroll', onScroll);
    }, []);
    const ceramics = WORKS.filter(w => w.kind === 'ceramic');
    const drawings = WORKS.filter(w => w.kind === 'drawing');
    return (
      <>
        <nav className={`top ${scrolled ? 'scrolled' : ''}`}>
          <div className="mark">Joon Park <span>· Virtual Studio</span></div>
          <div className="nav-center">Selected Works · Vol. I</div>
          <div className="nav-links">
            <button className={page === 'works' ? 'on' : ''} onClick={() => setPage('works')}>Works</button>
            <button className={page === 'about' ? 'on' : ''} onClick={() => setPage('about')}>About</button>
          </div>
        </nav>
        {page === 'works' ? <WorksPage ceramics={ceramics} drawings={drawings} /> : <AboutPage />}
      </>
    );
  }

  function WorksPage({ceramics, drawings}) {
    const highlightTitles = ['After she left my bed','Garden, After Dark','Manhattan','Serpentina di Córdoba','Pearl House','Swan married Whale','Reflection on the Lake'];
    const highlightSizes = ['feature','feature','normal','feature','feature','normal','normal'];
    const albumOrder = ['Conflict','Spring','Minotaur, In Need of Retirement'];
    const ceramicHighlights = highlightTitles.map(t => ceramics.find(w => w.title === t)).filter(Boolean);
    const ceramicAlbum = ceramics.filter(w => !highlightTitles.includes(w.title))
      .sort((a, b) => {
        const ia = albumOrder.indexOf(a.title), ib = albumOrder.indexOf(b.title);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
    return (
      <>
        <header className="hero">
          <div className="institution">Joon Park · Portfolio</div>
          <h1>At the boundary of<br/><em>clay &amp; paper</em>
            <small>Selected works, 2025 / 2026 · Singapore, Seoul</small>
          </h1>

        </header>
        <div className="room-head">
          <div className="roman">Room <b>I</b></div>
          <div>
            <h2>Ceramics</h2>
            <p>Hand-built pieces in which form arrives slowly through the hand. Nineteen works tracing the textures of memory: light through a forest, the discomfort of a dental chair, a swan married to a whale.</p>
          </div>
        </div>
        <div className="rule" />
        {ceramicHighlights.map((w, i) => <Plate key={w.title} work={w} size={highlightSizes[i]||'normal'} />)}
        <div className="draw-grid" style={{paddingTop: 80}}>
          {ceramicAlbum.map((w, i) => <DrawItem key={w.title} work={w} acc={String(i+1).padStart(2,'0')} />)}
        </div>
        <blockquote className="pullquote">
          “The hand-built form becomes the outline of an experience, and the brushwork follows the way memory surfaces.”
          <span className="att">Statement, 2026</span>
        </blockquote>
        <div className="room-head">
          <div className="roman">Room <b>II</b></div>
          <div>
            <h2>Works on Paper</h2>
            <p>Pen, brush pen, and acrylic marker on paper. A diary of looking: Singapore neighbours, bodies of water, a treetopus, and a widening study in stain and mark.</p>
          </div>
        </div>
        <div className="rule" />
        {LARGE_DRAWINGS.map((w) => <Plate key={w.title} work={w} size="feature" />)}
        <div className="draw-grid" style={{paddingTop: 80}}>
          {drawings.map((w, i) => <DrawItem key={w.title} work={w} acc={String(i+12).padStart(2,'0')} />)}
        </div>
        <footer className="colophon">
          <div><h4>Virtual Studio</h4>Singapore / Seoul<br/>By appointment</div>
          <div><h4>Contact</h4><a href="https://instagram.com/joonartistic" target="_blank" rel="noreferrer">@joonartistic</a></div>
          <div><h4>Catalogue</h4>Vol. I · 2025/2026<br/>23 works</div>
          <div><h4>©</h4>Joon Park, 2026<br/>All rights reserved</div>
        </footer>
      </>
    );
  }

  function Plate({work, acc, size}) {
    const [active, setActive] = useState(0);
    const [noteOpen, setNoteOpen] = useState(false);
    const hasMulti = work.frames.length > 1;
    const currentTitle = (work.frames[active] && work.frames[active].label) ? work.frames[active].label : work.title;
    const noteEntry = ARTIST_NOTES.find(n => n.title === currentTitle && n.note);
    useEffect(() => { setNoteOpen(false); }, [active]);
    const prev = (e) => { e.stopPropagation(); setActive(a => (a - 1 + work.frames.length) % work.frames.length); };
    const next = (e) => { e.stopPropagation(); setActive(a => (a + 1) % work.frames.length); };
    return (
      <div className={`plate ${size}`}>
        <div className="plate-frame">
          <div className="plate-img-wrap">
            <img className="plate-img" src={work.frames[active].src} alt={work.title}
              onClick={() => openLightbox(work, active)} style={{cursor: 'zoom-in'}} />
            {hasMulti && (
              <>
                <button className="plate-arrow plate-arrow-l" onClick={prev}>&#8592;</button>
                <button className="plate-arrow plate-arrow-r" onClick={next}>&#8594;</button>
                <div className="plate-counter">{active + 1} / {work.frames.length}</div>
              </>
            )}
          </div>
        </div>
        <div className="label-wrap">
          <div className="label-title">{currentTitle}</div>
          {work.note && <div className="label-note">{work.note}</div>}
          <div className="label">
            <div className="label-row">
              <div className="label-facts">
                <div className="yr">{work.year}</div>
                <div className="med">{work.meta}</div>
              </div>
              {noteEntry && (
                <button className="note-toggle" onClick={() => setNoteOpen(o => !o)}>
                  {noteOpen ? '\u2212 Artist\u2019s Note' : '+ Artist\u2019s Note'}
                </button>
              )}
            </div>
            {noteEntry && noteOpen && <div className="note-text">{noteEntry.note}</div>}
          </div>
        </div>
      </div>
    );
  }

  function SeriesBlock({work, acc}) {
    const n = work.frames.length;
    return (
      <div className="series">
        <div className="series-head">
          <div className="acc">Acc. JP · {acc} <b>{work.title}</b></div>
          <div>
            <div className="ttl">Five figures · {n} views</div>
            <div className="meta">{work.meta} · {work.year}</div>
            <p className="desc">Sibling figures explored as one work. Each piece holds the same hand, the same hour. Read across, not in sequence.</p>
          </div>
        </div>
        <div className="series-strip" style={{['--n']: Math.min(n, 6)}}>
          {work.frames.map((f, i) => (
            <figure className="series-fig" key={i} onClick={() => openLightbox(work, i)}>
              <img src={f.src} alt={f.label || work.title} />
              <figcaption className="cap">Fig. {String(i+1).padStart(2,'0')}<b>{f.label || work.title}</b></figcaption>
            </figure>
          ))}
        </div>
      </div>
    );
  }

  function DrawItem({work, acc}) {
    const [active, setActive] = useState(0);
    const [noteOpen, setNoteOpen] = useState(false);
    const hasMulti = work.frames.length > 1;
    const noteEntry = ARTIST_NOTES.find(n => n.title === work.title && n.note);
    const prev = (e) => { e.stopPropagation(); setActive(a => (a - 1 + work.frames.length) % work.frames.length); };
    const next = (e) => { e.stopPropagation(); setActive(a => (a + 1) % work.frames.length); };
    return (
      <div className="draw-item">
        <div className="draw-frame">
          <img src={work.frames[active].src} alt={work.title} onClick={() => openLightbox(work, active)} />
          {hasMulti && (
            <>
              <button className="plate-arrow plate-arrow-l" onClick={prev}>&#8592;</button>
              <button className="plate-arrow plate-arrow-r" onClick={next}>&#8594;</button>
              <div className="plate-counter">{active + 1} / {work.frames.length}</div>
            </>
          )}
        </div>
        <div className="draw-ttl">{work.title}</div>
        <div className="draw-cap">
          <div className="label-row">
            <div className="meta">{work.meta} · {work.year}</div>
            {noteEntry && (
              <button className="note-toggle" onClick={() => setNoteOpen(o => !o)}>
                {noteOpen ? '\u2212 Artist\u2019s Note' : '+ Artist\u2019s Note'}
              </button>
            )}
          </div>
          {noteEntry && noteOpen && <div className="note-text">{noteEntry.note}</div>}
        </div>
      </div>
    );
  }

  function AboutPage() {
    return (
      <div className="about">
        <div className="head">Statement</div>
        <h2>at the <em>boundary</em> of clay &amp; paper.</h2>
        <p>My work begins with personal experience. The quality of light in a forest, a landscape encountered while traveling, the discomfort of a dental procedure, the textures of everyday life find their way onto clay.</p>
        <p>The hand-built form becomes the outline of an experience, and the brushwork follows the way memory surfaces. I work at the boundary of ceramics and painting, exploring the moment when vivid experience becomes material.</p>
        <div className="about-block">
          <div className="about-label">Curriculum Vitae</div>
          <div className="cv-row"><span className="y">2025–</span><span>Ceramics &amp; Drawing practice, Singapore / Seoul</span></div>
          <div className="cv-row"><span className="y">2016</span><span>MSc Organizational Psychology, Erasmus University, Netherlands</span></div>
          <div className="cv-row"><span className="y">2014</span><span>BA Psychology, Catholic University of Korea</span></div>
        </div>
        <div className="about-block">
          <div className="about-label">Contact</div>
          <p style={{fontSize:17}}><a href="https://instagram.com/joonartistic" target="_blank" rel="noreferrer" style={{textDecoration:'underline', textDecorationColor:'var(--accent)', textUnderlineOffset:4}}>@joonartistic</a></p>
        </div>
      </div>
    );
  }

  let lightboxWork = null;
  let lightboxIdx = 0;

  function renderLightbox() {
    if (!lightboxWork) return;
    const w = lightboxWork;
    const hasMulti = w.frames.length > 1;
    document.getElementById('lightboxImg').src = w.frames[lightboxIdx].src;
    const countStr = hasMulti ? ` · ${lightboxIdx + 1} / ${w.frames.length}` : '';
    document.getElementById('lightboxMeta').textContent = `${w.title} · ${w.meta} · ${w.year}${countStr}`;
    document.getElementById('lightboxPrev').style.display = hasMulti ? 'block' : 'none';
    document.getElementById('lightboxNext').style.display = hasMulti ? 'block' : 'none';
  }

  window.openLightbox = function(work, idx) {
    lightboxWork = work;
    lightboxIdx = idx;
    renderLightbox();
    document.getElementById('lightbox').classList.add('open');
  };

  function lightboxPrev(e) {
    e.stopPropagation();
    lightboxIdx = (lightboxIdx - 1 + lightboxWork.frames.length) % lightboxWork.frames.length;
    renderLightbox();
  }
  function lightboxNext(e) {
    e.stopPropagation();
    lightboxIdx = (lightboxIdx + 1) % lightboxWork.frames.length;
    renderLightbox();
  }

  document.getElementById('lightboxPrev').addEventListener('click', lightboxPrev);
  document.getElementById('lightboxNext').addEventListener('click', lightboxNext);
  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    const isOpen = document.getElementById('lightbox').classList.contains('open');
    if (!isOpen) return;
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
    if (e.key === 'ArrowLeft' && lightboxWork && lightboxWork.frames.length > 1) {
      lightboxIdx = (lightboxIdx - 1 + lightboxWork.frames.length) % lightboxWork.frames.length;
      renderLightbox();
    }
    if (e.key === 'ArrowRight' && lightboxWork && lightboxWork.frames.length > 1) {
      lightboxIdx = (lightboxIdx + 1) % lightboxWork.frames.length;
      renderLightbox();
    }
  });

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
